<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0B12">
<title>Todo</title>
<style>
  body { font-family: system-ui, Roboto, sans-serif; background: var(--ax-bg); color: var(--ax-text); }
  .todo-head { display: flex; align-items: center; justify-content: space-between; gap: var(--ax-3); }
  .todo-add { display: flex; gap: var(--ax-2); }
  .todo-add .ax-input { flex: 1; }
  .todo-filters { display: flex; gap: var(--ax-2); overflow-x: auto; padding-bottom: var(--ax-2); }
  .todo-list { margin-top: var(--ax-3); }
  .todo-list .ax-row { align-items: flex-start; }
  .todo-title { transition: color var(--ax-fast) var(--ax-ease); }
  .todo-title.done { color: var(--ax-text-faint); text-decoration: line-through; }
  .todo-actions { display: flex; align-items: center; gap: var(--ax-1); }
  .todo-del { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: var(--ax-radius-pill); background: transparent; color: var(--ax-text-faint); }
  .todo-del:active { background: rgba(255,255,255,.08); color: var(--ax-danger); }
  .todo-foot { display: flex; justify-content: space-between; align-items: center; margin-top: var(--ax-4); }
</style></head>
<body>
<div class="ax-appbar">
  <div>
    <div class="ax-appbar__title">Todo</div>
    <div class="ax-appbar__sub" id="sub">Loading…</div>
  </div>
  <span class="ax-badge" id="badge">0</span>
</div>

<div class="ax-page">
  <div class="ax-card">
    <div class="todo-head">
      <div>
        <div class="ax-section-title">Today</div>
        <div class="ax-muted" style="font-size:.8rem">Small steps, kept visible.</div>
      </div>
    </div>
    <div class="todo-add" style="margin-top:var(--ax-3)">
      <input class="ax-input" id="inp" type="text" placeholder="Add a task…" autocomplete="off" enterkeyhint="done">
      <button class="ax-btn" id="add" aria-label="Add task">Add</button>
    </div>
    <div class="todo-filters" style="margin-top:var(--ax-3)">
      <button class="ax-chip ax-chip--active" data-filter="all">All</button>
      <button class="ax-chip" data-filter="open">Open</button>
      <button class="ax-chip" data-filter="done">Done</button>
    </div>
  </div>

  <div class="todo-list" id="list"></div>
  <div class="todo-foot" id="foot" hidden>
    <button class="ax-btn ax-btn--ghost ax-btn--small" id="clear">Clear completed</button>
    <span class="ax-muted" id="left"></span>
  </div>
</div>

<script>
var KEY = 'todos_v2';
var SEED = [
  { id: 1, text: 'Review the launch checklist', done: false },
  { id: 2, text: 'Book a dentist appointment', done: false },
  { id: 3, text: 'Send the Q2 invoice', done: true }
];
var todos = [];
var filter = 'all';

function esc(value) {
  return String(value).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function persist() {
  if (typeof iappyx === 'undefined') return;
  try { iappyx.save(KEY, JSON.stringify(todos)); } catch (e) {}
}

function toast(message) {
  if (typeof iappyx !== 'undefined' && iappyx.ui) iappyx.ui.toast(message);
}

function render() {
  var open = todos.filter(function (t) { return !t.done; }).length;
  var done = todos.length - open;
  document.getElementById('sub').textContent = open + ' open · ' + done + ' done';
  document.getElementById('badge').textContent = String(open);
  document.getElementById('left').textContent = todos.length + ' total';

  var visible = todos.filter(function (t) {
    return filter === 'all' || (filter === 'open' ? !t.done : t.done);
  });

  var list = document.getElementById('list');
  if (!visible.length) {
    list.innerHTML = '<div class="ax-empty">' +
      '<div class="ax-empty__icon">✓</div>' +
      '<div class="ax-empty__title">' + (todos.length ? 'Nothing here' : 'All clear') + '</div>' +
      '<div class="ax-muted">' + (todos.length ? 'Change the filter to see other tasks.' : 'Add your first task above and it will stay saved.') + '</div>' +
      '</div>';
  } else {
    list.innerHTML = '<div class="ax-list">' + visible.map(function (t) {
      return '<div class="ax-row" data-id="' + t.id + '">' +
        '<button class="ax-check" role="checkbox" aria-checked="' + t.done + '" data-action="toggle" aria-label="Toggle task"></button>' +
        '<div class="ax-row__body">' +
          '<div class="ax-row__title todo-title' + (t.done ? ' done' : '') + '">' + esc(t.text) + '</div>' +
        '</div>' +
        '<div class="todo-actions">' +
          '<button class="todo-del" data-action="delete" aria-label="Delete task">' +
            '<svg class="ax-icon ax-icon--sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  document.getElementById('foot').hidden = done === 0;
  document.querySelectorAll('[data-filter]').forEach(function (chip) {
    chip.classList.toggle('ax-chip--active', chip.dataset.filter === filter);
  });
}

function add() {
  var input = document.getElementById('inp');
  var text = input.value.trim();
  if (!text) return;
  todos.unshift({ id: Date.now(), text: text, done: false });
  input.value = '';
  filter = 'all';
  persist();
  render();
  toast('Task added');
}

function remove(id) {
  todos = todos.filter(function (t) { return t.id !== id; });
  persist();
  render();
  toast('Task deleted');
}

function confirmDelete(id) {
  var task = todos.find(function (t) { return t.id === id; });
  if (!task) return;
  if (typeof iappyx === 'undefined' || !iappyx.ui) { remove(id); return; }
  var cb = 'confirm_' + Date.now();
  window._iappyxCb = window._iappyxCb || {};
  window._iappyxCb[cb] = function (ok) { if (ok === true) remove(id); };
  iappyx.ui.confirm('Delete task?', task.text, cb);
}

function toggle(id) {
  var task = todos.find(function (t) { return t.id === id; });
  if (!task) return;
  task.done = !task.done;
  persist();
  render();
  if (task.done) toast('Done');
}

document.getElementById('list').addEventListener('click', function (event) {
  var action = event.target.closest('[data-action]');
  if (!action) return;
  var row = action.closest('[data-id]');
  if (!row) return;
  var id = Number(row.dataset.id);
  if (action.dataset.action === 'toggle') toggle(id);
  if (action.dataset.action === 'delete') confirmDelete(id);
});

document.querySelectorAll('[data-filter]').forEach(function (chip) {
  chip.addEventListener('click', function () {
    filter = chip.dataset.filter;
    render();
  });
});

document.getElementById('add').addEventListener('click', add);
document.getElementById('inp').addEventListener('keydown', function (event) {
  if (event.key === 'Enter') add();
});
document.getElementById('clear').addEventListener('click', function () {
  todos = todos.filter(function (t) { return !t.done; });
  persist();
  render();
  toast('Completed tasks cleared');
});

function init() {
  if (typeof iappyx === 'undefined') { setTimeout(init, 50); return; }
  try {
    var raw = iappyx.load(KEY);
    todos = raw ? JSON.parse(raw) : SEED.slice();
    if (!Array.isArray(todos)) todos = SEED.slice();
  } catch (e) {
    todos = SEED.slice();
  }
  persist();
  render();
}
window.addEventListener('load', function () { setTimeout(init, 100); });
</script>
</body></html>
