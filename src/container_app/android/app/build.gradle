plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keyPropsFile = rootProject.file('../key.properties')
def keyProps = new Properties()
if (keyPropsFile.exists()) {
    keyProps.load(new FileInputStream(keyPropsFile))
}

android {
    namespace = "com.konprostart.applix"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (keyPropsFile.exists()) {
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                // Explicit type - the keystore format must not depend on the file name.
                storeType (keyProps['storeType'] ?: 'PKCS12')
            }
        }
    }

    defaultConfig {
        applicationId = "com.konprostart.applix"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // The version code is derived from the semantic version, so it can never
        // go back: Android refuses an update whose version code is lower than
        // the installed one ("App not installed").
        def semver = (flutter.versionName ?: "0.0.0").tokenize(".")
        def major = semver.size() > 0 ? semver[0].toInteger() : 0
        def minor = semver.size() > 1 ? semver[1].toInteger() : 0
        def patch = semver.size() > 2 ? semver[2].toInteger() : 0
        versionCode = major * 100000000 + minor * 100000 + patch
        versionName = flutter.versionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig = keyPropsFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Keep /SPEC.md (repo root, published canonical copy) in sync with the bundled
// system prompt. Runs before every Gradle build, so any `flutter build apk`
// physically guarantees the two files match — no chance of drift.
task syncSpecMd {
    def src = file("$projectDir/../../assets/system_prompt.md")
    def dst = file("$projectDir/../../../../SPEC.md")
    inputs.file src
    outputs.file dst
    doLast {
        if (src.exists()) {
            dst.text = src.text
            println "✓ SPEC.md synced from system_prompt.md (${src.length()} bytes)"
        } else {
            println "⚠ syncSpecMd: source missing at ${src.absolutePath}"
        }
    }
}
preBuild.dependsOn syncSpecMd
